<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a Haircut</title>
<link rel="stylesheet" href="/css/style.css?v=13">
</head>
<body>
<header class="site slim">
  <a class="brand" href="/">Charlie's Cuts</a>
  <nav class="site-nav">
    <a href="/gallery.html">Gallery</a>
    <a href="/my-bookings.html">My bookings</a>
  </nav>
  <button type="button" id="stylistIconBtn" class="stylist-icon-btn" aria-label="Stylist options" aria-haspopup="true" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 12c2.7 0 8 1.3 8 4v2H4v-2c0-2.7 5.3-4 8-4zm0-2a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg>
  </button>
  <div id="stylistMenu" class="stylist-menu" style="display:none;">
    <a href="/login.html" id="stylistMenuLink">Stylist log in</a>
  </div>
</header>
<div class="hero-image-wrap">
  <img src="/img/logo.png?v=2" alt="Charlie's Cuts" class="hero-image">
</div>
<main>
  <p class="hero-sub">Two independent stylists - pick one and book an open 1/2 hr slot.</p>

  <h2 class="section-label">Our stylists</h2>
  <div id="list" class="hairdresser-list"></div>
</main>
<footer class="site">Bookings will be confirmed via email within 24 hours.</footer>
<script src="/js/api.js?v=3"></script>
<script>
async function load() {
  const list = document.getElementById('list');
  try {
    const hairdressers = await api('GET', '/api/hairdressers');
    if (hairdressers.length === 0) {
      list.innerHTML = '<p class="muted">No stylists set up yet.</p>';
      return;
    }
    list.innerHTML = hairdressers.map(hd => `
      <a class="stylist-row" href="/hairdresser.html?id=${hd.id}">
        <span class="stylist-avatar">${escapeHtml(initials(hd.display_name))}</span>
        <span class="stylist-row-info">
          <span class="stylist-row-name">${escapeHtml(hd.display_name)}</span>
          <span class="stylist-row-bio">${escapeHtml(hd.bio || 'Freelance hairdresser')}</span>
        </span>
        <span class="chevron" aria-hidden="true">&#8250;</span>
      </a>
    `).join('');
  } catch (e) {
    list.innerHTML = `<p class="error">${escapeHtml(e.message)}</p>`;
  }
}
function initials(name) {
  const words = (name || '').replace(/[^\p{L}\s]/gu, '').trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return '?';
  if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
  return (words[0][0] + words[1][0]).toUpperCase();
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}
async function initStylistIcon() {
  const menuLink = document.getElementById('stylistMenuLink');
  try {
    await api('GET', '/api/auth/hairdresser/me');
    menuLink.textContent = 'My dashboard';
    menuLink.href = '/dashboard.html';
  } catch (e) {
    // Not logged in as a stylist - leave the default "Stylist log in" link.
  }
}

const stylistIconBtn = document.getElementById('stylistIconBtn');
const stylistMenu = document.getElementById('stylistMenu');
stylistIconBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  const isOpen = stylistMenu.style.display !== 'none';
  stylistMenu.style.display = isOpen ? 'none' : 'block';
  stylistIconBtn.setAttribute('aria-expanded', String(!isOpen));
});
document.addEventListener('click', (e) => {
  if (!stylistMenu.contains(e.target) && e.target !== stylistIconBtn) {
    stylistMenu.style.display = 'none';
    stylistIconBtn.setAttribute('aria-expanded', 'false');
  }
});

load();
initStylistIcon();
</script>
</body>
</html>
