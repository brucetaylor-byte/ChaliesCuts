<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking status</title>
<link rel="stylesheet" href="/css/style.css?v=15">
</head>
<body>
<header class="site">
  <a class="brand" href="/"><img src="/img/logo.png?v=2" alt="Charlie's Cuts" class="brand-logo"></a>
  <nav class="site-nav"><a href="/">Home</a></nav>
</header>
<main>
  <h1>Your booking</h1>
  <div id="content"><p class="muted">Loading...</p></div>
</main>
<script src="/js/api.js?v=4"></script>
<script>
const token = qs('token');

async function load() {
  const el = document.getElementById('content');
  if (!token) {
    el.innerHTML = '<p class="error">No booking link provided.</p>';
    return;
  }
  try {
    const b = await api('GET', `/api/bookings/token/${token}`);
    render(b);
  } catch (e) {
    el.innerHTML = `<p class="error">${esc(e.message)}</p>`;
  }
}

// Read-only status - bookings can no longer be cancelled or changed online.
// Any change (cancelling, rescheduling) has to go through Charlie directly,
// ideally at least 24 hours out, same as the booking-confirmation email says.
function render(b) {
  const el = document.getElementById('content');
  const isActive = b.status === 'pending' || b.status === 'approved';
  el.innerHTML = `
    <div class="card">
      <div><span class="badge ${b.status}">${b.status}</span></div>
      <p><strong>${esc(b.hairdresser.display_name)}</strong> &mdash; ${fmtDate(b.slot.date)} at ${fmtTime(b.slot.start_time)}</p>
      <p class="muted">Booked as ${esc(b.customer_name)} (${esc(b.customer_email)})</p>
      ${b.note ? `<p class="muted">Note: ${esc(b.note)}</p>` : ''}
      ${isActive ? `<p class="muted">Need to make a change? Contact Charlie on 0493 032 545 if you need to make any change to your appointment, ideally at least 24 hours before.</p>` : ''}
    </div>
  `;
}

function esc(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

load();
</script>
</body>
</html>
