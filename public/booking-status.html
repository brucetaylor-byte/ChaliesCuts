<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking status</title>
<link rel="stylesheet" href="/css/style.css?v=13">
</head>
<body>
<header class="site">
  <a class="brand" href="/"><img src="/img/logo.png?v=2" alt="Charlie's Cuts" class="brand-logo"></a>
  <nav class="site-nav"><a href="/">Home</a></nav>
</header>
<main>
  <h1>Your booking</h1>
  <div id="content"><p class="muted">Loading...</p></div>
</main>
<script src="/js/api.js?v=3"></script>
<script>
const token = qs('token');

async function load() {
  const el = document.getElementById('content');
  if (!token) {
    el.innerHTML = '<p class="error">No booking link provided.</p>';
    return;
  }
  try {
    const b = await api('GET', `/api/bookings/token/${token}`);
    render(b);
  } catch (e) {
    el.innerHTML = `<p class="error">${esc(e.message)}</p>`;
  }
}

function render(b) {
  const el = document.getElementById('content');
  const canCancel = b.status === 'pending' || b.status === 'approved';
  el.innerHTML = `
    <div class="card">
      <div><span class="badge ${b.status}">${b.status}</span></div>
      <p><strong>${esc(b.hairdresser.display_name)}</strong> &mdash; ${fmtDate(b.slot.date)} at ${fmtTime(b.slot.start_time)}</p>
      <p class="muted">Booked as ${esc(b.customer_name)} (${esc(b.customer_email)})</p>
      ${b.note ? `<p class="muted">Note: ${esc(b.note)}</p>` : ''}
      ${canCancel ? `<button class="danger" id="cancelBtn">Cancel booking</button>` : ''}
      <p id="msg"></p>
    </div>
  `;
  const cancelBtn = document.getElementById('cancelBtn');
  if (cancelBtn) {
    cancelBtn.addEventListener('click', async () => {
      if (!confirm('Cancel this booking?')) return;
      try {
        const updated = await api('POST', '/api/bookings/cancel', { token });
        render(updated);
      } catch (e) {
        document.getElementById('msg').textContent = e.message;
        document.getElementById('msg').className = 'error';
      }
    });
  }
}

function esc(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

load();
</script>
</body>
</html>
