<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stylist login</title>
<link rel="stylesheet" href="/css/style.css?v=15">
</head>
<body>
<header class="site">
  <a class="brand" href="/"><img src="/img/logo.png?v=2" alt="Charlie's Cuts" class="brand-logo"></a>
  <nav class="site-nav"><a href="/">Home</a></nav>
</header>
<main>
  <h1>Stylist login</h1>
  <div class="card">
    <form id="form">
      <label for="username">Username</label>
      <input id="username" required autocomplete="username">
      <label for="password">Password</label>
      <input id="password" type="password" required autocomplete="current-password">
      <div style="margin-top:1rem;">
        <button type="submit">Log in</button>
      </div>
      <p id="msg"></p>
    </form>
  </div>
</main>
<script src="/js/api.js?v=4"></script>
<script>
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  try {
    await api('POST', '/api/auth/hairdresser/login', {
      username: document.getElementById('username').value,
      password: document.getElementById('password').value
    });
    location.href = '/dashboard.html';
  } catch (err) {
    msg.textContent = err.message;
    msg.className = 'error';
  }
});
</script>
</body>
</html>
